[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-demo"
version = "0.1.0"
description = "Offline screen-recording post-production renderer"
requires-python = ">=3.9"
dependencies = [
    "av==13.1.0",
    "Pillow==11.3.0",
    "numpy==2.0.2",
    "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
local-demo = "local_demo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
